name: Build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build LiveSpeechSTT.exe
        run: |
          pyinstaller --name LiveSpeechSTT --windowed --onedir --noconfirm `
            --icon=assets\icon.ico `
            --add-data "assets;assets" `
            --additional-hooks-dir=pyinstaller_hooks `
            --collect-all faster_whisper `
            --collect-all ctranslate2 `
            --collect-all pyaudiowpatch `
            --hidden-import=webrtcvad `
            --hidden-import=pynput.keyboard._win32 `
            --hidden-import=pynput.mouse._win32 `
            main.py

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: LiveSpeechSTT-windows-exe
          path: dist/LiveSpeechSTT/

      - uses: actions/upload-artifact@v4
        with:
          name: LiveSpeechSTT-windows-installer
          path: installer_output/*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PortAudio (needed to build PyAudio)
        run: brew install portaudio

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build LiveSpeechSTT.app
        run: |
          pyinstaller --name LiveSpeechSTT --windowed --onedir --noconfirm \
            --icon=assets/icon.icns \
            --add-data "assets:assets" \
            --additional-hooks-dir=pyinstaller_hooks \
            --collect-all faster_whisper \
            --collect-all ctranslate2 \
            --hidden-import=webrtcvad \
            main.py

      - name: Zip the .app bundle
        run: ditto -c -k --sequesterRsrc --keepParent dist/LiveSpeechSTT.app dist/LiveSpeechSTT-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: LiveSpeechSTT-macos-app
          path: dist/LiveSpeechSTT-macos.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact folders
        run: |
          mkdir -p release
          cp artifacts/LiveSpeechSTT-windows-installer/*.exe release/ 2>/dev/null || true
          cp artifacts/LiveSpeechSTT-macos-app/*.zip release/ 2>/dev/null || true

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
